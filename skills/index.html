<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Skill Store — Travel Design</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      @font-face { font-family: "YS Text"; src: url("../assets/fonts/ys-text-regular.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
      @font-face { font-family: "YS Text"; src: url("../assets/fonts/ys-text-medium.ttf") format("truetype"); font-weight: 500; font-style: normal; font-display: swap; }
      @font-face { font-family: "YS Text"; src: url("../assets/fonts/ys-text-bold.ttf") format("truetype"); font-weight: 700; font-style: normal; font-display: swap; }
      @font-face { font-family: "YS Display"; src: url("../assets/fonts/ys-display-medium.ttf") format("truetype"); font-weight: 500; font-style: normal; font-display: swap; }
      :root { color: #ededee; background: #0d0d0f; font: 16px/1.25 "YS Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: dark; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; background: #0d0d0f; }
      main { width: min(100%, 400px); min-height: 100vh; margin: 0 auto; padding: 0 0 calc(8px + env(safe-area-inset-bottom)); }
      .intro { display: flex; flex-direction: column; gap: 12px; padding: calc(24px + env(safe-area-inset-top)) 24px 24px; border-radius: 0 0 32px 32px; background: #1b1a1e; }
      .intro__title { display: flex; align-items: center; }
      h1 { margin: 0; font-family: "YS Display", "YS Text", sans-serif; font-size: 32px; font-weight: 500; line-height: 36px; letter-spacing: -.48px; }
      .intro__text { margin: 0; font-size: 16px; font-weight: 400; line-height: 20px; }
      #skills { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
      .skill-card { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; overflow: hidden; padding: 24px; border-radius: 32px; background: #1b1a1e; }
      .skill-card__content { display: flex; width: 100%; flex-direction: column; gap: 6px; }
      h2 { margin: 0; color: #ededee; font-family: "YS Display", "YS Text", sans-serif; font-size: 20px; font-weight: 500; line-height: 22px; }
      .description { margin: 0; color: #ededee; font-size: 16px; font-weight: 400; line-height: 20px; }
      .dependency-note { margin: 0; color: #9c9ba2; font-size: 14px; line-height: 18px; }
      .updated { display: flex; max-width: 100%; min-width: 0; gap: 6px; align-items: center; margin: 0; overflow: hidden; color: #9c9ba2; font-size: 16px; line-height: 20px; white-space: nowrap; }
      .updated__date, .updated__label { flex: 0 0 auto; }
      .updated__dot { flex: 0 0 auto; font-size: 14px; line-height: 18px; }
      .contributors { display: flex; flex: 0 0 auto; align-items: center; isolation: isolate; }
      .author-avatar { display: inline-grid; width: 20px; height: 20px; flex: 0 0 20px; place-items: center; overflow: hidden; border: 1px solid #1b1a1e; border-radius: 50%; background: #6f4bff; color: #ffed2f; object-fit: cover; font-size: 9px; font-weight: 500; }
      .author-avatar + .author-avatar { margin-left: -4px; }
      button { min-height: 40px; border: 0; border-radius: 16px; padding: 0 14px; background: #35343a; color: #ededee; cursor: pointer; font: 500 14px/18px "YS Text", sans-serif; transition: background .15s ease, transform .15s ease; }
      button:hover { background: #414047; }
      button:active { background: #4a4950; transform: scale(.98); }
      button:disabled { cursor: not-allowed; opacity: .55; }
      button:focus-visible { outline: 2px solid #ffed2f; outline-offset: 2px; }
      .empty { margin: 0; padding: 24px; border-radius: 32px; background: #1b1a1e; color: #9c9ba2; }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <main>
      <header class="intro">
        <div class="intro__title"><h1>Skill Store</h1></div>
        <p class="intro__text">Скопируйте промпт, вставьте в Кодекс и он сам установит нужные скилы</p>
      </header>
      <section id="skills" aria-live="polite"><p class="empty">Загружаем скилы…</p></section>
    </main>
    <script>
      const telegram = window.Telegram?.WebApp; telegram?.ready(); telegram?.expand();
      const target = document.querySelector('#skills');
      const rawRoot = 'https://raw.githubusercontent.com/Yuriysteam/yatraveldesign/main';
      const monthNames = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
      const formatDate = timestamp => { const value = new Date(timestamp * 1000); return `${value.getDate()} ${monthNames[value.getMonth()]}`; };
      const packageUrl = item => `${rawRoot}/skills/${item.id}/skill.zip?updated=${encodeURIComponent(item.updated_at)}`;
      const dependencyClosure = (item, byId) => {
        const result = []; const visiting = new Set(); const visited = new Set();
        const visit = current => {
          if (visiting.has(current.id)) throw new Error(`Циклическая зависимость: ${current.id}`);
          if (visited.has(current.id)) return;
          visiting.add(current.id);
          (current.dependencies || []).forEach(id => { const dependency = byId.get(id); if (!dependency) throw new Error(`Не найден скил: ${id}`); visit(dependency); });
          visiting.delete(current.id); visited.add(current.id); result.push(current);
        };
        visit(item); return result;
      };
      const prompt = required => `Установи скил «${required[required.length - 1].name}» и все нужные для него скилы.\n\nУстанови по порядку:\n${required.map((item, index) => `${index + 1}. ${item.name}: ${packageUrl(item)}`).join('\n')}\n\nКаждый архив распакуй в отдельную папку скилов текущего инструмента. Не меняй остальные скилы. После установки проверь, что у каждого скила доступен SKILL.md.`;
      async function copy(text, button) {
        let copied = false;
        try { await navigator.clipboard.writeText(text); copied = true; }
        catch {
          const field = document.createElement('textarea'); field.value = text; document.body.append(field); field.select();
          try { copied = document.execCommand('copy'); } finally { field.remove(); }
        }
        button.textContent = copied ? 'Промпт скопирован' : 'Не удалось скопировать';
        setTimeout(() => button.textContent = 'Скопировать промпт', 1800);
      }
      fetch(`catalog.json?updated=${Date.now()}`, { cache: 'no-store' }).then(response => response.ok ? response.json() : Promise.reject()).then(items => {
        target.replaceChildren(); if (!items.length) { target.innerHTML = '<p class="empty">Скилы пока не опубликованы.</p>'; return; }
        const byId = new Map(items.map(item => [item.id, item]));
        items.sort((a, b) => b.updated_at - a.updated_at).forEach(item => {
          const card = document.createElement('article'); card.className = 'skill-card';
          const content = document.createElement('div'); content.className = 'skill-card__content';
          const title = document.createElement('h2'); title.textContent = item.name;
          const description = document.createElement('p'); description.className = 'description'; description.textContent = item.description;
          let required; let dependencyError;
          try { required = dependencyClosure(item, byId); } catch (error) { dependencyError = error; required = [item]; }
          const dependencyNote = document.createElement('p'); dependencyNote.className = 'dependency-note';
          if (dependencyError) dependencyNote.textContent = `Ошибка установки: ${dependencyError.message}`;
          else if (required.length > 1) dependencyNote.textContent = `Также установятся: ${required.slice(0, -1).map(skill => skill.name).join(', ')}`;
          const updated = document.createElement('p'); updated.className = 'updated';
          const dot = document.createElement('span'); dot.className = 'updated__dot'; dot.setAttribute('aria-hidden', 'true'); dot.textContent = '·';
          const date = document.createElement('span'); date.className = 'updated__date'; date.textContent = `Обновлено ${formatDate(item.updated_at)}`;
          const label = document.createElement('span'); label.className = 'updated__label'; label.textContent = 'Обновляли';
          const contributors = Array.isArray(item.contributors) ? item.contributors.slice(0, 3) : [];
          const avatars = document.createElement('span'); avatars.className = 'contributors'; avatars.setAttribute('aria-label', `Обновляли: ${contributors.map(person => person.name).join(', ')}`);
          contributors.forEach(person => {
            let avatar;
            if (person.avatar) { avatar = document.createElement('img'); avatar.src = `../assets/avatars/${encodeURIComponent(person.avatar)}`; avatar.alt = ''; }
            else { avatar = document.createElement('span'); avatar.textContent = (person.name || '?').slice(0, 1).toUpperCase(); avatar.setAttribute('aria-hidden', 'true'); }
            avatar.className = 'author-avatar'; avatars.append(avatar);
          });
          updated.append(date, dot, label, avatars);
          const button = document.createElement('button'); button.type = 'button'; button.textContent = dependencyError ? 'Нельзя установить' : 'Скопировать промпт'; button.disabled = Boolean(dependencyError); button.addEventListener('click', () => copy(prompt(required), button));
          content.append(title, description); if (dependencyNote.textContent) content.append(dependencyNote); card.append(content, updated, button); target.append(card);
        });
      }).catch(() => { target.innerHTML = '<p class="empty">Не удалось загрузить каталог.</p>'; });
    </script>
  </body>
</html>
