<!doctype html>
<html lang="ru">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Skills</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @font-face { font-family: "YS Text"; src: url("../assets/fonts/ys-text-regular.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "YS Text"; src: url("../assets/fonts/ys-text-medium.ttf") format("truetype"); font-weight: 500; font-style: normal; font-display: swap; }
    @font-face { font-family: "YS Text"; src: url("../assets/fonts/ys-text-bold.ttf") format("truetype"); font-weight: 700; font-style: normal; font-display: swap; }
    :root { color: #f5f7f8; background: #050607; font: 16px/1.4 "YS Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: radial-gradient(110% 36% at 50% -5%, #34505a 0%, #142127 38%, #050607 82%); }
    main { max-width: 720px; margin: auto; padding: 32px 16px calc(40px + env(safe-area-inset-bottom)); }
    h1 { margin: 0 0 24px; color: #f8fafb; font-size: 28px; font-weight: 500; letter-spacing: -.02em; }
    #skills { display: grid; gap: 32px; }
    article { padding: 0 2px; }
    h2 { margin: 0 0 7px; color: #fff; font-size: 19px; font-weight: 500; letter-spacing: -.01em; }
    p { margin: 0; color: rgb(245 247 248 / 68%); }
    .updated { margin-top: 14px; color: rgb(245 247 248 / 44%); font-size: 13px; }
    button { width: 100%; margin-top: 16px; border: 1px solid rgb(255 255 255 / 7%); border-radius: 14px; padding: 12px 14px; background: #2d2e30; color: #f6f7f8; box-shadow: inset 0 1px 0 rgb(255 255 255 / 6%); font: 500 16px/1.2 "YS Text", sans-serif; transition: background .16s ease, transform .16s ease; }
    button:active { background: #404143; transform: scale(.985); }
    button:focus-visible { outline: 2px solid #9fc9dd; outline-offset: 3px; }
    .empty { color: rgb(245 247 248 / 56%); }
  </style>
  <main>
    <h1>Skills</h1>
    <section id="skills"><p class="empty">Загружаем skills…</p></section>
  </main>
  <script>
    const telegram = window.Telegram?.WebApp; telegram?.ready(); telegram?.expand();
    const target = document.querySelector('#skills');
    const rawRoot = 'https://raw.githubusercontent.com/Yuriysteam/yatraveldesign/main';
    const packageUrl = item => `${rawRoot}/skills/${item.id}/skill.zip?updated=${encodeURIComponent(item.updated_at)}`;
    const prompt = item => `Установи skill «${item.name}»: скачай ${packageUrl(item)}, распакуй в папку skills текущего инструмента и не меняй остальные skills.`;
    async function copy(text, button) {
      try { await navigator.clipboard.writeText(text); }
      catch { const field = document.createElement('textarea'); field.value = text; document.body.append(field); field.select(); document.execCommand('copy'); field.remove(); }
      button.textContent = 'Prompt скопирован'; setTimeout(() => button.textContent = 'Скопировать prompt установки', 1800);
    }
    fetch(`${rawRoot}/skills/catalog.json?updated=${Date.now()}`, { cache: 'no-store' }).then(response => response.ok ? response.json() : Promise.reject()).then(items => {
      target.replaceChildren();
      if (!items.length) { target.innerHTML = '<p class="empty">Skills пока не опубликованы.</p>'; return; }
      items.sort((a, b) => b.updated_at - a.updated_at).forEach(item => {
        const card = document.createElement('article'); const title = document.createElement('h2'); title.textContent = item.name;
        const description = document.createElement('p'); description.textContent = item.description;
        const updated = document.createElement('p'); updated.className = 'updated'; updated.textContent = `Обновлено ${new Date(item.updated_at * 1000).toLocaleDateString('ru-RU')} · ${item.updated_by}`;
        const button = document.createElement('button'); button.textContent = 'Скопировать prompt установки'; button.addEventListener('click', () => copy(prompt(item), button));
        card.append(title, description, updated, button); target.append(card);
      });
    }).catch(() => { target.innerHTML = '<p class="empty">Не удалось загрузить каталог.</p>'; });
  </script>
</html>
