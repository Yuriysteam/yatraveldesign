<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Отель оплачен — Яндекс Путешествия</title>
    <link rel="icon" href="./assets/images/logo-planet.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css?v=4">
    <link rel="stylesheet" href="./shared-search-header.css?v=2">
    <link rel="stylesheet" href="./hotel-confirmation.css?v=1">
    <script src="./shared-search-header.js?v=1" defer></script>
    <script src="./hotel-confirmation.js?v=2" defer></script>
  </head>
  <body>
    <div class="hotel-confirmation-page" data-ready="false">
      <header class="search-header shared-search-header" data-travel-header data-active="hotel" aria-label="Шапка Яндекс Путешествий"></header>

      <main class="hotel-confirmation-main">
        <section class="hotel-confirmation-island" aria-labelledby="hotel-confirmation-title">
          <div class="hotel-confirmation-content">
            <div class="hotel-confirmation-status" role="status">
              <span class="hotel-confirmation-status__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="m6.5 12.1 3.35 3.35L17.7 7.6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"/>
                </svg>
              </span>
              <span>Отель оплачен</span>
            </div>

            <div class="hotel-confirmation-heading">
              <h1 id="hotel-confirmation-title">Бронирование подтверждено</h1>
              <p>Все детали сохранены в разделе «Мои поездки».</p>
            </div>

            <article class="confirmed-hotel-card" aria-labelledby="confirmed-hotel-name">
              <img id="confirmed-hotel-image" src="./assets/hotel-detail/hero-main.png" alt="">
              <div class="confirmed-hotel-card__copy">
                <div class="confirmed-hotel-card__title-row">
                  <h2 id="confirmed-hotel-name">AZIMUT Смоленская 3*</h2>
                  <span class="confirmed-hotel-card__work" id="confirmed-work-badge" hidden>
                    <img src="./assets/icons/briefcase.svg" alt="">
                    Рабочая поездка
                  </span>
                </div>
                <p class="confirmed-hotel-card__location"><span id="confirmed-hotel-city">Москва</span><span aria-hidden="true">·</span><span id="confirmed-hotel-address">Смоленская улица, 16</span></p>
                <p class="confirmed-hotel-card__room" id="confirmed-hotel-room" hidden></p>
              </div>
            </article>

            <dl class="hotel-confirmation-facts">
              <div>
                <dt>Даты</dt>
                <dd id="confirmed-hotel-dates">21–25 июня</dd>
              </div>
              <div>
                <dt>Гости</dt>
                <dd id="confirmed-hotel-guests">1 взрослый</dd>
              </div>
              <div>
                <dt>Оплачено</dt>
                <dd id="confirmed-hotel-total">34 600 ₽</dd>
              </div>
            </dl>

            <div class="hotel-confirmation-actions">
              <a class="hotel-confirmation-action hotel-confirmation-action--primary" id="open-my-trips" href="./trips.html#personal">Открыть мои поездки</a>
              <a class="hotel-confirmation-action hotel-confirmation-action--secondary" id="go-home" href="./index.html">На главную</a>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
