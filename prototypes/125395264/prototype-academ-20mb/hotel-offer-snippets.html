<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Настройка тарифного снипета</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="hotel-offer-snippets.css?v=16"><link rel="stylesheet" href="hotel-offer-widget.css?v=3">  <meta name="robots" content="noindex, nofollow, noarchive">
</head>
<body class="snippets-page"><main><header class="snippets-header"><a href="hotel.html"><img src="assets/hotel/arrow-long-left-new-24.svg" alt="">Страница отеля</a><h1>Настройка тарифного снипета</h1><p>Снипет и его параметры рядом на одном экране.</p></header>
<section class="snippet-workbench"><div class="snippet-preview" aria-label="Предпросмотр тарифного снипета"><div class="preview-heading"><h2>Предпросмотр</h2><span id="previewContext"></span></div><div id="snippetPreview"></div></div><aside class="snippet-settings" aria-label="Настройки тарифного снипета"><h2>Настройки</h2><table><tbody>
<tr><th scope="row"><label for="preset">Готовый вариант</label></th><td><select id="preset"></select></td></tr>
<tr><th scope="row"><label for="viewport">Контекст</label></th><td><select id="viewport"><option value="desktop-1440">Экран 1440 px</option><option value="desktop-1280">Экран 1280 px</option><option value="hotel-grid">2 колонки · 792 px</option></select></td></tr>
<tr><th scope="row"><label for="cancellation">Отмена</label></th><td><select id="cancellation"><option value="full">Полный штраф</option><option value="details">Штраф с деталями</option><option value="free">Есть бесплатная отмена</option></select></td></tr>
<tr><th scope="row"><label for="meal">Питание</label></th><td><select id="meal"><option value="none">Без питания · можно докупить</option><option value="none-no-upsell">Без питания · нельзя докупить</option><option value="included">С питанием</option></select></td></tr>
<tr><th scope="row"><label for="price">Цена</label></th><td><input id="price" type="text" value="33 000 ₽"></td></tr>
<tr><th scope="row"><label for="special">Спецусловия</label></th><td><input id="special" type="checkbox"></td></tr>
<tr><th scope="row"><label for="rack">Rack</label></th><td><input id="rack" type="checkbox" checked></td></tr>
<tr><th scope="row"><label for="vat">НДС</label></th><td><input id="vat" type="checkbox" checked></td></tr>
<tr><th scope="row"><label for="commission">Комиссия</label></th><td><input id="commission" type="checkbox" checked></td></tr>
</tbody></table></aside></section></main><script src="hotel-offer-widget.js?v=2"></script><script src="hotel-offer-snippets.js?v=18"></script></body></html>
